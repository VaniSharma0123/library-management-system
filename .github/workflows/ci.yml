name: CI
on:
  push:
    branches: [main, resume-upgrades]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server
        working-directory: server
        run: |
          npm install
          npm test --if-present
      - name: Client
        working-directory: client
        run: |
          npm install
          npm run build --if-present
        env:
          CI: false